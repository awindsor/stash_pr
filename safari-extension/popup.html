<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            margin: 0;
            padding: 16px;
            background: #fff;
        }
        .hidden { display: none; }
        input { 
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #4338CA; }
        #auth-error { color: #DC2626; font-size: 12px; margin: 8px 0; }
        .save-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .save-item:hover { background: #f5f5f5; }
        .save-item strong { display: block; margin-bottom: 4px; }
        .save-item small { color: #999; }
    </style>
</head>
<body>
    <div id="auth-view">
        <h3 style="margin-top: 0;">Sign In to Stash</h3>
        <form id="auth-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="signin-btn">Sign In</button>
            <button type="button" id="signup-btn">Create Account</button>
        </form>
        <div id="auth-error"></div>
    </div>

    <div id="main-view" class="hidden">
        <h3>Stash</h3>
        <button id="save-page-btn">Save This Page</button>
        <button id="signout-btn" style="background: #6B7280;">Sign Out</button>
        <a id="open-app-link" href="#" style="display: block; text-align: center; margin-top: 12px; color: #4F46E5; font-size: 12px;">Open Web App</a>
        <div style="margin-top: 16px; border-top: 1px solid #eee; padding-top: 12px;">
            <small style="color: #666;">Recent Saves:</small>
            <div id="saves-list"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
